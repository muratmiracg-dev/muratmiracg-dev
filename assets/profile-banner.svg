<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Murat Miraç Gedik - Data Analytics and Business Intelligence</title>
  <desc id="desc">A professional dark blue banner with subtle analytical charts and profile positioning.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2340"/>
      <stop offset="1" stop-color="#123a52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d2c0"/>
      <stop offset="1" stop-color="#62a8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39d2c0" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#39d2c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#91acc2" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="canvasClip">
      <rect width="1600" height="460" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1600" height="460" rx="24" fill="url(#background)"/>
    <rect width="1600" height="460" rx="24" fill="url(#grid)"/>
    <circle cx="1320" cy="90" r="280" fill="url(#glow)"/>
    <circle cx="210" cy="430" r="250" fill="url(#glow)" opacity="0.6"/>

    <g opacity="0.48">
      <path d="M1090 318 C1160 276 1205 292 1260 242 C1318 190 1370 216 1430 145" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
      <path d="M1090 348 C1165 332 1225 350 1288 307 C1350 264 1398 280 1482 236" fill="none" stroke="#80a6c8" stroke-opacity="0.52" stroke-width="3" stroke-linecap="round"/>
      <g fill="#39d2c0">
        <circle cx="1090" cy="318" r="8"/>
        <circle cx="1260" cy="242" r="8"/>
        <circle cx="1430" cy="145" r="8"/>
      </g>
      <g fill="#62a8ff">
        <circle cx="1090" cy="348" r="6"/>
        <circle cx="1288" cy="307" r="6"/>
        <circle cx="1482" cy="236" r="6"/>
      </g>
    </g>

    <g transform="translate(118 106)">
      <rect x="0" y="0" width="10" height="224" rx="5" fill="url(#accent)"/>
      <text x="42" y="72" fill="#f5f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="0.5">
        Murat Miraç Gedik
      </text>
      <text x="45" y="125" fill="#a9c2d5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="4">
        DATA ANALYTICS · BUSINESS INTELLIGENCE · STATISTICS
      </text>
      <text x="45" y="184" fill="#d8e6f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="400">
        Turning complex data into clear, decision-ready insight
      </text>
      <text x="45" y="230" fill="#66d7c8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1.6">
        SQL  ·  POWER BI  ·  PYTHON  ·  EXCEL  ·  DAX  ·  FORECASTING
      </text>
    </g>
  </g>

  <rect x="24" y="24" width="1552" height="412" rx="18" fill="none" stroke="#b9d2e5" stroke-opacity="0.12" stroke-width="2"/>
</svg>
