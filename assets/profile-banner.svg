<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Murat Miraç Gedik — Banking Analytics, Risk Analytics &amp; Business Intelligence</title>
  <desc id="desc">Modern dark profile banner with banking and risk dashboard visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.50" stop-color="#0a1b30"/>
      <stop offset="1" stop-color="#0d3142"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d3ba"/>
      <stop offset="1" stop-color="#6a9cff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35d3ba" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#35d3ba" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6a9cff" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#6a9cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#aac0d1" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="clip"><rect width="1600" height="500" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1600" height="500" rx="30" fill="url(#bg)"/>
    <rect width="1600" height="500" rx="30" fill="url(#grid)"/>
    <circle cx="1435" cy="60" r="340" fill="url(#glowA)"/>
    <circle cx="1015" cy="515" r="310" fill="url(#glowB)"/>

    <g transform="translate(100 86)">
      <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#accent)"/>
      <text x="42" y="73" fill="#f5f9fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="750">Murat Miraç Gedik</text>
      <text x="44" y="133" fill="#9dbbd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="2.1">BANKING ANALYTICS · RISK ANALYTICS · BUSINESS INTELLIGENCE</text>
      <text x="44" y="196" fill="#d8e5ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="450">Credit Risk · AML/KYC · Treasury &amp; ALM · Decision Support</text>

      <g transform="translate(44 236)">
        <rect width="108" height="42" rx="21" fill="#10263c" stroke="#35d3ba" stroke-opacity="0.35"/>
        <text x="54" y="27" text-anchor="middle" fill="#dff8f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">SQL</text>
        <rect x="122" width="132" height="42" rx="21" fill="#10263c" stroke="#6a9cff" stroke-opacity="0.35"/>
        <text x="188" y="27" text-anchor="middle" fill="#edf3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">POWER BI</text>
        <rect x="268" width="130" height="42" rx="21" fill="#10263c" stroke="#35d3ba" stroke-opacity="0.35"/>
        <text x="333" y="27" text-anchor="middle" fill="#dff8f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">PYTHON</text>
        <rect x="412" width="164" height="42" rx="21" fill="#10263c" stroke="#6a9cff" stroke-opacity="0.35"/>
        <text x="494" y="27" text-anchor="middle" fill="#edf3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">STATISTICS</text>
      </g>

      <text x="44" y="328" fill="#9bb3c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="550">SEGEM Certified · SPL Level 3 Candidate · Statistics B.Sc. Candidate</text>
    </g>

    <g transform="translate(1115 78)" filter="url(#shadow)">
      <rect width="380" height="344" rx="30" fill="#091727" fill-opacity="0.82" stroke="#b1cadc" stroke-opacity="0.15"/>
      <text x="28" y="42" fill="#e6eff5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" letter-spacing="1.7">RISK CONTROL TOWER</text>

      <g transform="translate(28 70)">
        <g>
          <rect width="96" height="70" rx="16" fill="#10263c"/>
          <circle cx="22" cy="21" r="7" fill="#35d3ba"/>
          <text x="16" y="45" fill="#8daac0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">CREDIT RISK</text>
          <text x="16" y="62" fill="#f4f8fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750">PD · GINI</text>
        </g>
        <g transform="translate(114 0)">
          <rect width="96" height="70" rx="16" fill="#10263c"/>
          <circle cx="22" cy="21" r="7" fill="#6a9cff"/>
          <text x="16" y="45" fill="#8daac0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">TREASURY</text>
          <text x="16" y="62" fill="#f4f8fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750">LCR · EVE</text>
        </g>
        <g transform="translate(228 0)">
          <rect width="96" height="70" rx="16" fill="#10263c"/>
          <circle cx="22" cy="21" r="7" fill="#35d3ba"/>
          <text x="16" y="45" fill="#8daac0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">FIN. CRIME</text>
          <text x="16" y="62" fill="#f4f8fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750">AML · KYC</text>
        </g>
      </g>

      <g transform="translate(30 182)">
        <line x1="0" y1="94" x2="318" y2="94" stroke="#9db4c5" stroke-opacity="0.16"/>
        <line x1="0" y1="57" x2="318" y2="57" stroke="#9db4c5" stroke-opacity="0.09"/>
        <line x1="0" y1="20" x2="318" y2="20" stroke="#9db4c5" stroke-opacity="0.09"/>
        <rect x="8" y="61" width="20" height="33" rx="4" fill="#365b7a"/>
        <rect x="48" y="48" width="20" height="46" rx="4" fill="#426f92"/>
        <rect x="88" y="53" width="20" height="41" rx="4" fill="#4b789c"/>
        <rect x="128" y="35" width="20" height="59" rx="4" fill="#527fa5"/>
        <rect x="168" y="43" width="20" height="51" rx="4" fill="#5a86ac"/>
        <rect x="208" y="26" width="20" height="68" rx="4" fill="#628eb5"/>
        <rect x="248" y="33" width="20" height="61" rx="4" fill="#6996be"/>
        <rect x="288" y="13" width="20" height="81" rx="4" fill="#70a0cb"/>
        <path d="M18 76 C54 66 72 72 98 58 C126 43 145 50 178 38 C207 27 227 34 258 20 C281 10 296 15 310 7" fill="none" stroke="#35d3ba" stroke-width="4" stroke-linecap="round"/>
        <circle cx="98" cy="58" r="5" fill="#35d3ba"/>
        <circle cx="178" cy="38" r="5" fill="#35d3ba"/>
        <circle cx="258" cy="20" r="5" fill="#35d3ba"/>
      </g>
    </g>
  </g>
  <rect x="24" y="24" width="1552" height="452" rx="22" fill="none" stroke="#c3d6e4" stroke-opacity="0.10" stroke-width="2"/>
</svg>