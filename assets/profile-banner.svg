<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Murat Miraç Gedik - Banking, Risk Analytics and Business Intelligence</title>
  <desc id="desc">Professional profile banner focused on banking analytics, risk analytics, business intelligence and financial decision support.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.50" stop-color="#0a2038"/>
      <stop offset="1" stop-color="#10394a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d6bd"/>
      <stop offset="1" stop-color="#5e9dff"/>
    </linearGradient>
    <linearGradient id="barGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38d6bd" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5e9dff" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38d6bd" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38d6bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#9bb3c8" stroke-opacity="0.085" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="canvasClip">
      <rect width="1600" height="460" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1600" height="460" rx="24" fill="url(#background)"/>
    <rect width="1600" height="460" rx="24" fill="url(#grid)"/>
    <circle cx="1375" cy="55" r="300" fill="url(#glow)"/>
    <circle cx="140" cy="430" r="250" fill="url(#glow)" opacity="0.45"/>

    <!-- Financial analytics panel -->
    <g transform="translate(1090 72)" opacity="0.95" filter="url(#softShadow)">
      <rect x="0" y="0" width="390" height="316" rx="28" fill="#0b1c30" fill-opacity="0.72" stroke="#a6c4da" stroke-opacity="0.15"/>

      <text x="30" y="43" fill="#dbe8f2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">RISK &amp; PERFORMANCE SIGNALS</text>

      <g transform="translate(30 73)">
        <rect x="0" y="0" width="95" height="64" rx="14" fill="#102b43" stroke="#38d6bd" stroke-opacity="0.22"/>
        <text x="15" y="24" fill="#86a7be" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">CREDIT</text>
        <text x="15" y="48" fill="#f2f7fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">PD / GINI</text>
      </g>

      <g transform="translate(145 73)">
        <rect x="0" y="0" width="95" height="64" rx="14" fill="#102b43" stroke="#5e9dff" stroke-opacity="0.22"/>
        <text x="15" y="24" fill="#86a7be" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">ALM</text>
        <text x="15" y="48" fill="#f2f7fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">LCR / EVE</text>
      </g>

      <g transform="translate(260 73)">
        <rect x="0" y="0" width="100" height="64" rx="14" fill="#102b43" stroke="#38d6bd" stroke-opacity="0.22"/>
        <text x="15" y="24" fill="#86a7be" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">AML</text>
        <text x="15" y="48" fill="#f2f7fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">KYC / TM</text>
      </g>

      <g transform="translate(30 166)">
        <line x1="0" y1="96" x2="330" y2="96" stroke="#91abc0" stroke-opacity="0.18"/>
        <line x1="0" y1="58" x2="330" y2="58" stroke="#91abc0" stroke-opacity="0.10"/>
        <line x1="0" y1="20" x2="330" y2="20" stroke="#91abc0" stroke-opacity="0.10"/>

        <rect x="8" y="57" width="24" height="39" rx="5" fill="url(#barGradient)" opacity="0.70"/>
        <rect x="48" y="42" width="24" height="54" rx="5" fill="url(#barGradient)" opacity="0.76"/>
        <rect x="88" y="51" width="24" height="45" rx="5" fill="url(#barGradient)" opacity="0.68"/>
        <rect x="128" y="27" width="24" height="69" rx="5" fill="url(#barGradient)" opacity="0.82"/>
        <rect x="168" y="36" width="24" height="60" rx="5" fill="url(#barGradient)" opacity="0.78"/>
        <rect x="208" y="17" width="24" height="79" rx="5" fill="url(#barGradient)" opacity="0.90"/>
        <rect x="248" y="29" width="24" height="67" rx="5" fill="url(#barGradient)" opacity="0.82"/>
        <rect x="288" y="8" width="24" height="88" rx="5" fill="url(#barGradient)" opacity="0.96"/>

        <path d="M20 76 C58 68 78 76 100 62 C126 47 145 55 180 42 C210 30 230 35 260 22 C282 13 302 17 320 7" fill="none" stroke="#38d6bd" stroke-width="4" stroke-linecap="round"/>
        <circle cx="100" cy="62" r="5" fill="#38d6bd"/>
        <circle cx="180" cy="42" r="5" fill="#38d6bd"/>
        <circle cx="260" cy="22" r="5" fill="#38d6bd"/>
        <circle cx="320" cy="7" r="5" fill="#38d6bd"/>
      </g>
    </g>

    <!-- Main identity -->
    <g transform="translate(112 88)">
      <rect x="0" y="0" width="10" height="286" rx="5" fill="url(#accent)"/>

      <text x="42" y="67" fill="#f5f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="750" letter-spacing="0.4">
        Murat Miraç Gedik
      </text>

      <text x="45" y="122" fill="#8fb5cf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2.7">
        BANKING &amp; INSURANCE ANALYTICS · RISK ANALYTICS
      </text>

      <text x="45" y="163" fill="#8fb5cf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2.7">
        DATA ANALYTICS · BUSINESS INTELLIGENCE
      </text>

      <text x="45" y="218" fill="#d9e5ee" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">
        Turning financial data into explainable, decision-ready insight
      </text>

      <text x="45" y="267" fill="#64d9c8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.4">
        SQL · POWER BI · PYTHON · CREDIT RISK · AML/KYC · ALM/IRRBB
      </text>
    </g>
  </g>

  <rect x="24" y="24" width="1552" height="412" rx="18" fill="none" stroke="#b9d2e5" stroke-opacity="0.12" stroke-width="2"/>
</svg>
